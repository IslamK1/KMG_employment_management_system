{% extends "base.html" %}

{% block title %}Новая скважина{% endblock %}

{% block content %}
<div class="max-w-2xl">
  <h1 class="text-2xl font-bold text-gray-900 mb-6">Новая скважина</h1>

  {% if error %}
  <div class="bg-red-50 border border-red-200 text-red-700 rounded-lg px-4 py-3 mb-6 text-sm">{{ error }}</div>
  {% endif %}

  <div class="bg-white rounded-xl shadow-sm border border-gray-200 p-8">
    <form method="post" action="/wells/create" class="space-y-5">
      <div>
        <label class="block text-sm font-semibold text-gray-700 mb-1.5">Название</label>
        <input type="text" name="name" placeholder="Скважина-01AB" required
               class="w-full px-4 py-3 rounded-lg border border-gray-300 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-transparent">
      </div>
      <div>
        <label class="block text-sm font-semibold text-gray-700 mb-1.5">Тип</label>
        <select name="type" required
                class="w-full px-4 py-3 rounded-lg border border-gray-300 text-sm bg-white focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-transparent">
          <option value="нефтяная">нефтяная</option>
          <option value="газовая">газовая</option>
          <option value="разведочная">разведочная</option>
          <option value="нагнетательная">нагнетательная</option>
        </select>
      </div>
      <div>
        <label class="block text-sm font-semibold text-gray-700 mb-1.5">Максимальная глубина бурения (м)</label>
        <input type="number" name="max_drilling_depth" min="0" placeholder="3500" required
               class="w-full px-4 py-3 rounded-lg border border-gray-300 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-transparent">
      </div>
      <div>
        <label class="block text-sm font-semibold text-gray-700 mb-1.5">Компания</label>
        <select name="oil_company_id" required
                class="w-full px-4 py-3 rounded-lg border border-gray-300 text-sm bg-white focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-transparent">
          <option value="">Выберите компанию</option>
          {% for company in companies %}
          <option value="{{ company.id }}">{{ company.name }} ({{ company.region }})</option>
          {% endfor %}
        </select>
      </div>
      <div class="flex gap-3 pt-2">
        <button type="submit" class="bg-indigo-600 hover:bg-indigo-700 text-white text-sm font-semibold px-6 py-3 rounded-lg transition-colors">Создать</button>
        <a href="/wells/" class="bg-gray-100 hover:bg-gray-200 text-gray-700 text-sm font-semibold px-6 py-3 rounded-lg transition-colors">Отмена</a>
      </div>
    </form>
  </div>
</div>
{% endblock %}
