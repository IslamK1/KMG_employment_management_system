{% extends "base.html" %}

{% block title %}Редактирование скважины{% endblock %}

{% block content %}
<div class="max-w-2xl">
  <h1 class="text-2xl font-bold text-gray-900 mb-6">Редактировать: {{ well.name }}</h1>

  {% if error %}
  <div class="bg-red-50 border border-red-200 text-red-700 rounded-lg px-4 py-3 mb-6 text-sm">{{ error }}</div>
  {% endif %}

  <div class="bg-white rounded-xl shadow-sm border border-gray-200 p-8">
    <form method="post" action="/wells/edit/{{ well.id }}" class="space-y-5">
      <div>
        <label class="block text-sm font-semibold text-gray-700 mb-1.5">Название</label>
        <input type="text" name="name" value="{{ well.name }}" required
               class="w-full px-4 py-3 rounded-lg border border-gray-300 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-transparent">
      </div>
      <div>
        <label class="block text-sm font-semibold text-gray-700 mb-1.5">Тип</label>
        <select name="type" required
                class="w-full px-4 py-3 rounded-lg border border-gray-300 text-sm bg-white focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-transparent">
          {% for t in ["нефтяная", "газовая", "разведочная", "нагнетательная"] %}
          <option value="{{ t }}" {% if well.type == t %}selected{% endif %}>{{ t }}</option>
          {% endfor %}
        </select>
      </div>
      <div>
        <label class="block text-sm font-semibold text-gray-700 mb-1.5">Максимальная глубина бурения (м)</label>
        <input type="number" name="max_drilling_depth" min="0" value="{{ well.max_drilling_depth }}" required
               class="w-full px-4 py-3 rounded-lg border border-gray-300 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-transparent">
      </div>
      <div>
        <label class="block text-sm font-semibold text-gray-700 mb-1.5">Компания</label>
        <select name="oil_company_id" required
                class="w-full px-4 py-3 rounded-lg border border-gray-300 text-sm bg-white focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-transparent">
          {% for company in companies %}
          <option value="{{ company.id }}" {% if well.oil_company_id == company.id %}selected{% endif %}>
            {{ company.name }} ({{ company.region }})
          </option>
          {% endfor %}
        </select>
      </div>
      <div class="flex gap-3 pt-2">
        <button type="submit" class="bg-indigo-600 hover:bg-indigo-700 text-white text-sm font-semibold px-6 py-3 rounded-lg transition-colors">Сохранить</button>
        <a href="/wells/{{ well.id }}" class="bg-gray-100 hover:bg-gray-200 text-gray-700 text-sm font-semibold px-6 py-3 rounded-lg transition-colors">Отмена</a>
      </div>
    </form>
  </div>
</div>
{% endblock %}
