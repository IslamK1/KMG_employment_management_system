{% extends "base.html" %}

{% block title %}Новая компания{% endblock %}

{% block content %}
<div class="max-w-2xl">
  <h1 class="text-2xl font-bold text-gray-900 mb-6">Новая компания</h1>

  {% if error %}
  <div class="bg-red-50 border border-red-200 text-red-700 rounded-lg px-4 py-3 mb-6 text-sm">{{ error }}</div>
  {% endif %}

  <div class="bg-white rounded-xl shadow-sm border border-gray-200 p-8">
    <form method="post" action="/companies/create" class="space-y-5">
      <div>
        <label class="block text-sm font-semibold text-gray-700 mb-1.5">Название</label>
        <input type="text" name="name" placeholder="РАО «Пример» Мунай" required
               class="w-full px-4 py-3 rounded-lg border border-gray-300 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-transparent">
      </div>
      <div>
        <label class="block text-sm font-semibold text-gray-700 mb-1.5">Регион</label>
        <input type="text" name="region" placeholder="Атырауская область" required
               class="w-full px-4 py-3 rounded-lg border border-gray-300 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-transparent">
      </div>
      <div class="flex gap-3 pt-2">
        <button type="submit" class="bg-indigo-600 hover:bg-indigo-700 text-white text-sm font-semibold px-6 py-3 rounded-lg transition-colors">Создать</button>
        <a href="/companies/" class="bg-gray-100 hover:bg-gray-200 text-gray-700 text-sm font-semibold px-6 py-3 rounded-lg transition-colors">Отмена</a>
      </div>
    </form>
  </div>
</div>
{% endblock %}
