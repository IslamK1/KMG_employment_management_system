<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Редактирование</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>

  <nav class="navbar">
    <div class="nav-left">
      <a href="javascript:history.back()" class="btn btn-sm"> Назад</a>
      <a href="/employees/" class="btn btn-sm">Главная</a>
    </div>
    <div class="nav-brand">EMS</div>
    <div class="nav-right">
      <a href="/logout" class="btn btn-danger btn-sm">Выход</a>
    </div>
  </nav>

  <main class="container">
    <h1>Редактировать: {{ emp.name }}</h1>

    {% if error %}
      <div class="alert error">{{ error }}</div>
    {% endif %}

    <div class="card">
      <form method="post" action="/employees/edit/{{ emp.id }}">
        <div class="form-group">
          <label>Имя</label>
          <input type="text" name="name" value="{{ emp.name }}" required>
        </div>
        <div class="form-group">
          <label>Email</label>
          <input type="email" name="email" value="{{ emp.email }}" required>
        </div>
        <div class="form-group">
          <label>Должность</label>
          <input type="text" name="position" value="{{ emp.position or '' }}">
        </div>
        <div class="form-group">
          <label>Компания</label>
          <select name="oil_company_id" class="form-select">
            <option value="">Не выбрано</option>
            {% for company in companies %}
            <option value="{{ company.id }}"
              {% if emp.oil_company_id == company.id %}selected{% endif %}>
              {{ company.name }} ({{ company.region }})
            </option>
            {% endfor %}
          </select>
        </div>
        <div class="form-actions">
          <button type="submit" class="btn btn-primary">Сохранить</button>
          <a href="javascript:history.back()" class="btn">Отмена</a>
        </div>
      </form>
    </div>
  </main>

</body>
</html>
