{% extends "base.html" %}

{% block title %}Редактирование{% endblock %}

{% block content %}
  <h1>Редактировать: {{ emp.name }}</h1>

  {% if error %}
    <div class="alert error">{{ error }}</div>
  {% endif %}

  <div class="card">
    <form method="post" action="/employees/edit/{{ emp.id }}">
      <div class="form-group">
        <label>Имя</label>
        <input type="text" name="name" value="{{ emp.name }}" required>
      </div>
      <div class="form-group">
        <label>Email</label>
        <input type="email" name="email" value="{{ emp.email }}" required>
      </div>
      <div class="form-group">
        <label>Должность</label>
        <input type="text" name="position" value="{{ emp.position or '' }}">
      </div>
      <div class="form-group">
        <label>Компания</label>
        <select name="oil_company_id" class="form-select">
          <option value="">Не выбрано</option>
          {% for company in companies %}
          <option value="{{ company.id }}"
            {% if emp.oil_company_id == company.id %}selected{% endif %}>
            {{ company.name }} ({{ company.region }})
          </option>
          {% endfor %}
        </select>
      </div>
      <div class="form-actions">
        <button type="submit" class="btn btn-primary">Сохранить</button>
        <a href="/employees/{{ emp.id }}" class="btn">Отмена</a>
      </div>
    </form>
  </div>
{% endblock %}
