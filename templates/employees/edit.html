<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Редактирование</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>

  <nav class="navbar">
    <div class="nav-brand">EMS</div>
    <div class="nav-links">
      <a href="/employees/" class="btn btn-sm">Назад</a>
      <a href="/logout" class="btn btn-danger btn-sm">Выйти</a>
    </div>
  </nav>

  <main class="container">
    <h1>Редактировать: {{ emp.name }}</h1>

    {% if error %}
      <div class="alert error">{{ error }}</div>
    {% endif %}

    <div class="card">
      <form method="post" action="/employees/edit/{{ emp.id }}">
        <div class="form-group">
          <label>Имя</label>
          <input type="text" name="name" value="{{ emp.name }}" required>
        </div>
        <div class="form-group">
          <label>Email</label>
          <input type="email" name="email" value="{{ emp.email }}" required>
        </div>
        <div class="form-group">
          <label>Должность</label>
          <input type="text" name="position" value="{{ emp.position or '' }}">
        </div>
        <div class="form-actions">
          <button type="submit" class="btn btn-primary">Сохранить</button>
          <a href="/employees/{{ emp.id }}" class="btn">Отмена</a>
        </div>
      </form>
    </div>
  </main>

</body>
</html>
