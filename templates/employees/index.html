<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Сотрудники</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>

  <nav class="navbar">
    <div class="nav-brand">EMS</div>
    <div class="nav-links">
      <span>{{ user }}</span>
      <a href="/logout" class="btn btn-danger btn-sm">Выйти</a>
    </div>
  </nav>

  <main class="container">
    <div class="page-header">
      <h1>Сотрудники</h1>
      <a href="/employees/create" class="btn btn-primary">+ Добавить</a>
    </div>

    {% if employees %}
    <table class="table">
      <thead>
        <tr>
          <th>#</th>
          <th>Имя</th>
          <th>Email</th>
          <th>Должность</th>
          <th>Действия</th>
        </tr>
      </thead>
      <tbody>
        {% for emp in employees %}
        <tr>
          <td>{{ emp.id }}</td>
          <td>{{ emp.name }}</td>
          <td>{{ emp.email }}</td>
          <td>{{ emp.position or "—" }}</td>
          <td class="actions">
            <a href="/employees/{{ emp.id }}" class="btn btn-sm">Просмотр</a>
            <a href="/employees/edit/{{ emp.id }}" class="btn btn-warning btn-sm">Изменить</a>
            <a href="/employees/delete/{{ emp.id }}"
               class="btn btn-danger btn-sm"
               onclick="return confirm('Удалить сотрудника?')">Удалить</a>
          </td>
        </tr>
        {% endfor %}
      </tbody>
    </table>
    {% else %}
      <div class="empty-state">Сотрудников пока нет. <a href="/employees/create">Добавить первого</a></div>
    {% endif %}
  </main>

</body>
</html>
