{% extends "base.html" %}

{% block title %}Новый сотрудник{% endblock %}

{% block content %}
  <h1>Новый сотрудник</h1>

  {% if error %}
    <div class="alert error">{{ error }}</div>
  {% endif %}

  <div class="card">
    <form method="post" action="/employees/create">
      <div class="form-group">
        <label>Имя</label>
        <input type="text" name="name" placeholder="Иван Иванов" required>
      </div>
      <div class="form-group">
        <label>Email</label>
        <input type="email" name="email" placeholder="ivan@company.com" required>
      </div>
      <div class="form-group">
        <label>Должность</label>
        <input type="text" name="position" placeholder="Backend Developer">
      </div>
      <div class="form-group">
        <label>Компания</label>
        <select name="oil_company_id" class="form-select">
          <option value="">Не выбрано</option>
          {% for company in companies %}
          <option value="{{ company.id }}">{{ company.name }} ({{ company.region }})</option>
          {% endfor %}
        </select>
      </div>
      <div class="form-group">
        <label>Пароль</label>
        <input type="password" name="password" required>
      </div>
      <div class="form-actions">
        <button type="submit" class="btn btn-primary">Создать</button>
        <a href="/employees/" class="btn">Отмена</a>
      </div>
    </form>
  </div>
{% endblock %}
