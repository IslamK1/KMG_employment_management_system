{% extends "base.html" %}

{% block title %}Редактирование рапорта{% endblock %}

{% block content %}
<div class="max-w-2xl">
  <h1 class="text-2xl font-bold text-gray-900 mb-6">Редактирование рапорта</h1>

  {% if error %}
  <div class="bg-red-50 border border-red-200 text-red-700 rounded-lg px-4 py-3 mb-6 text-sm">{{ error }}</div>
  {% endif %}

  <div class="bg-white rounded-xl shadow-sm border border-gray-200 p-8">
    <div class="mb-5 text-sm text-gray-600">
      Скважина: <span class="font-semibold text-gray-900">{{ report.well.name }}</span>
      · Дата: <span class="font-semibold text-gray-900">{{ report.date }}</span>
    </div>

    <form method="post" action="/productions/edit/{{ report.id }}" class="space-y-5">
      <div class="grid grid-cols-2 gap-4">
        <div>
          <label class="block text-sm font-semibold text-gray-700 mb-1.5">Часы работы (0-24)</label>
          <input type="number" name="working_hours" min="0" max="23.99" step="0.01" value="{{ report.working_hours }}" required class="w-full px-4 py-3 rounded-lg border border-gray-300 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-transparent">
        </div>
        <div>
          <label class="block text-sm font-semibold text-gray-700 mb-1.5">Жидкость (тонн)</label>
          <input type="number" name="liquid_volume" min="0" step="0.01" value="{{ report.liquid_volume }}" required class="w-full px-4 py-3 rounded-lg border border-gray-300 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-transparent">
        </div>
      </div>
      <div class="grid grid-cols-2 gap-4">
        <div>
          <label class="block text-sm font-semibold text-gray-700 mb-1.5">Обводненность (0-100%)</label>
          <input type="number" name="water_cut" min="0" max="100" step="0.1" value="{{ report.water_cut }}" required class="w-full px-4 py-3 rounded-lg border border-gray-300 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-transparent">
        </div>
        <div>
          <label class="block text-sm font-semibold text-gray-700 mb-1.5">Плотность (г/см³)</label>
          <input type="number" name="density" min="0.7" max="1.0" step="0.001" value="{{ report.density }}" required class="w-full px-4 py-3 rounded-lg border border-gray-300 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-transparent">
        </div>
      </div>
      <div class="flex gap-3 pt-2">
        <button type="submit" class="bg-indigo-600 hover:bg-indigo-700 text-white text-sm font-semibold px-6 py-3 rounded-lg transition-colors">Сохранить изменения</button>
        <a href="/productions/" class="bg-gray-100 hover:bg-gray-200 text-gray-700 text-sm font-semibold px-6 py-3 rounded-lg transition-colors">Отмена</a>
      </div>
    </form>
  </div>
</div>
{% endblock %}
