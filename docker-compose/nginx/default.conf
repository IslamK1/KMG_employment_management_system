server {
    listen 80;
    server_name localhost;

    # Ограничение на размер загружаемых файлов (Excel-импорт)
    client_max_body_size 25M;

    # Встроенный DNS-резолвер Docker. Благодаря ему nginx повторно
    # резолвит имя app каждые 10с, а не запоминает IP один раз при старте —
    # поэтому после пересборки контейнера app (новый IP) не будет 502.
    resolver 127.0.0.11 valid=10s;

    # Статику отдаёт nginx напрямую (быстрее, чем через FastAPI)
    location /static/ {
        alias /var/www/static/;
        access_log off;
        expires 7d;
    }

    # Всё остальное — на ASGI-приложение.
    # Имя app вынесено в переменную: это заставляет nginx резолвить его
    # на каждом запросе (через resolver выше), а не кэшировать при старте.
    location / {
        set $upstream_app app;
        proxy_pass http://$upstream_app:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}