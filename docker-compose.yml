# Общие переменные окружения для Python-сервисов (app, celery).
# DATABASE_URL и REDIS_URL указывают на docker-сервисы, а не на localhost.
x-app-environment: &app-environment
  DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-employee_management}
  REDIS_URL: redis://redis:6379/0
  # Учётка администратора (создаётся при старте, можно переопределить)
  ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@mail.ru}
  ADMIN_PASSWORD: ${ADMIN_PASSWORD:-12345}
  ADMIN_NAME: ${ADMIN_NAME:-Admin}
  # Ключ подписи JWT для мобильного API (в проде задай свой)
  JWT_SECRET: ${JWT_SECRET:-dev-insecure-change-me-in-production}
  # Настройки SMTP для Mailpit (приложение может использовать их для писем)
  SMTP_HOST: mailpit
  SMTP_PORT: "1025"

services:
  # --- Веб-приложение FastAPI (gunicorn + uvicorn worker) ---
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ems-app
    restart: unless-stopped
    working_dir: /var/www
    environment: *app-environment
    ports:
      - "8000:8000"          # прямой доступ к приложению (для отладки)
    volumes:
      - ./:/var/www:cached   # живой код без пересборки образа
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - ems-network

  # --- Nginx: reverse-proxy + отдача статики ---
  nginx:
    image: nginx:alpine
    container_name: ems-nginx
    restart: unless-stopped
    ports:
      - "8080:80"            # главный вход в приложение: http://localhost:8080
    volumes:
      - ./:/var/www:cached
      - ./docker-compose/nginx:/etc/nginx/conf.d/
    depends_on:
      - app
    networks:
      - ems-network

  # --- PostgreSQL ---
  db:
    image: postgres:16-alpine
    container_name: ems-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-employee_management}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "5432:5432"
    volumes:
      - ems-db-data:/var/lib/postgresql/data
    networks:
      - ems-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-employee_management}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # --- Redis: брокер и backend для Celery ---
  redis:
    image: redis:alpine
    container_name: ems-redis
    restart: unless-stopped
    networks:
      - ems-network

  # --- Celery worker: фоновые задачи (импорт/экспорт Excel) ---
  celery:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ems-celery
    restart: unless-stopped
    working_dir: /var/www
    environment: *app-environment
    command: celery -A app.celery_app worker -l INFO
    volumes:
      - ./:/var/www:cached
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - ems-network

  # --- Frontend: сборка и watch Tailwind CSS ---
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ems-frontend
    working_dir: /var/www
    command: sh -c "npm install && npm run css:build && npm run css:watch"
    volumes:
      - ./:/var/www:cached
      - /var/www/node_modules   # анонимный том маскирует node_modules с хоста
    depends_on:
      - app
    networks:
      - ems-network

  # --- Mailpit: перехват исходящих писем (Web UI + SMTP) ---
  mailpit:
    image: axllent/mailpit
    container_name: ems-mailpit
    restart: unless-stopped
    ports:
      - "8025:8025"           # веб-интерфейс: http://localhost:8025
      - "1025:1025"           # SMTP
    networks:
      - ems-network

  # --- Adminer: веб-клиент для PostgreSQL ---
  adminer:
    image: adminer
    container_name: ems-adminer
    restart: unless-stopped
    ports:
      - "8081:8080"           # http://localhost:8081
    depends_on:
      db:
        condition: service_healthy
    networks:
      - ems-network

networks:
  ems-network:
    driver: bridge

volumes:
  ems-db-data:
    driver: local
